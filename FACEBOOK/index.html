<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Sign Up</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header class="headerMain">
        <nav class="navbar">
            <div class="logoText">
                <label class="invisibleBtn4">hie</label>
                <h1 class="logofb">facebook</h1>
                <label class="invisibleBtn5">hie</label>
            </div>
            <div class="right-items">
                <div class="emailInput">
                    <label>Email or Phone</label>
                    <input class="input" type="email">
                    <label class="invisibleBtn1">-</label>
                </div>
                <div class="passwordInput">
                    <label>Password</label>
                    <input class="inputpwd" type="password">
                    <label class="forgotacc"><a>Forgot Account?</a></label>
                </div>
                <div class="loginBtnBox">
                    <button class="invisibleBtn3">hie</button>
                    <button class="loginBtn">Log In</button>
                    <button class="invisibleBtn2">hie</button>
                </div>
            </div>
        </nav>
    </header>
    <main class="mainBody">
        <div class="topMiddle">
            <div class="headimage">
                <h2 class="leftHeading">Facebook helps you connect and share with the people in your life</h2>
                <img class="bodyImage" src="/assets/pngwing.com.png" alt="Connecting People Image">
            </div>
            <div class="fillerform">
                <h1 class="headingFillerForm">Create an account</h1>
                <h3 class="fillerFormMini">It's quick and easy.</h3>
                <div class="inputSignup">
                    <div class="detailsBox">
                        <div class="humanDetails">
                            <div class="signNames">
                                <input class="firstName" placeholder="First name">
                                <input class="lastName" placeholder="Surname">
                            </div>

                            <div class="otherDetails">
                                <input class="mailOrNumber" placeholder="Mobile number or email address">
                                <input class="signUpPwd" placeholder="New Password">
                                <input class="signUpPwd" placeholder="Confirm Password">

                                <p class="bday">Birthday</p>

                                <div class="birthdayBox">
                                    <select class="day">
                                       <option value="Day">Day</option>
                                       <option value="1">1</option>
                                       <option value="2">2</option>
                                       <option value="3">3</option>
                                       <option value="4">4</option>
                                       <option value="5">5</option>
                                       <option value="6">6</option>
                                       <option value="7">7</option>
                                       <option value="8">8</option>
                                       <option value="9">9</option>
                                       <option value="10">10</option>
                                       <option value="11">11</option>
                                       <option value="12">12</option>
                                       <option value="13">13</option>
                                       <option value="14">14</option>
                                       <option value="15">15</option>
                                       <option value="16">16</option>
                                       <option value="17">17</option>
                                       <option value="18">18</option>
                                       <option value="19">19</option>
                                       <option value="20">20</option>
                                       <option value="21">21</option>
                                       <option value="22">22</option>
                                       <option value="23">23</option>
                                       <option value="24">24</option>
                                       <option value="25">25</option>
                                       <option value="26">26</option>
                                       <option value="27">28</option>
                                       <option value="29">29</option>
                                       <option value="30">30</option>
                                       <option value="31">31</option>
                                       
                                    </select>
                                    <select class="month">
                                        <option value="Month">Month</option>
                                       <option value="January">January</option>
                                    </select>
                                    <select class="year">
                                        <option value="Year">Year</option>
                                       <option value="2024">2024</option>
                                    </select>
                                    <a href="#"><i class="fa-solid fa-circle-question"></i></a>
                                </div>
                                <p class="genderSelection">Gender</p>
                                
                                <div class="radioGender">
                                    <input type="radio" name="gender"><Label class="maleGender">Male</Label>
                                    <input type="radio" name="gender"><Label class="femaleGender">Female</Label>  
                                    <input type="radio" name="gender"><label class="customGender">Custom</label>
                                    <a href="#"><i class="fa-solid fa-circle-question"></i></a>
                                    <button class="invisibleBtn7">HIE</button>
                                </div>
                                <p class="lastStatement">By clicking Sign Up, you agree to our Terms, Data Policy and Cookie Policy. You may receive SMS notifications from us and can opt out at any time</p>

                                <button class="signUpBtn" href="#"><label class="signUpLbl">Sign Up</label></button>
                            </div>

                        </div>
                        <button class="invisibleBtn6">hi</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>

    </footer>
    
</body>
</html>
